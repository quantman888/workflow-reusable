name: Docker Publish Reusable Workflow

on:
  workflow_call:
    inputs:
      OCI_REGISTRY:
        description: "Docker registry host (for example: registry.example.com)"
        required: true
        type: string
      OCI_IMAGE_NAME:
        description: "Image repository/name (for example: team/app)"
        required: true
        type: string
      OCI_DOCKERFILE_PATH:
        description: "Dockerfile path"
        required: false
        type: string
        default: "Dockerfile"
      OCI_BUILD_CONTEXT:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      OCI_TARGET_PLATFORMS:
        description: "Target platforms"
        required: false
        type: string
        default: "linux/amd64"
      OCI_BUILD_ARGS:
        description: "Build args, newline-delimited KEY=VALUE entries"
        required: false
        type: string
        default: ""
      OCI_TAGS:
        description: "Tags or full refs to publish; newline/comma/semicolon separated. Empty publishes sha-<short-sha>."
        required: false
        type: string
        default: ""
      OCI_PUSH_IMAGE:
        description: "Whether to push image to registry"
        required: false
        type: boolean
        default: true
      OCI_PUSH_MODE:
        description: "Image push mode: buildx pushes through BuildKit registry exporter; docker loads a single-platform image then uses docker push"
        required: false
        type: string
        default: "buildx"
      OCI_EXTRA_PULL_REGISTRY:
        description: "Optional additional registry host to login before build for private base image pulls"
        required: false
        type: string
        default: ""
      OCI_CACHE_SCOPE:
        description: "Optional GitHub Actions Buildx cache scope"
        required: false
        type: string
        default: ""
      RUNS_ON_JSON:
        description: "JSON value for runs-on (for example: \"ubuntu-latest\" or [\"self-hosted\",\"linux\"])"
        required: false
        type: string
        default: '"ubuntu-latest"'
    outputs:
      image_ref:
        description: "Fully qualified image reference without tag"
        value: ${{ jobs.docker_publish.outputs.image_ref }}
      image_tags:
        description: "Published image tags as comma-separated list"
        value: ${{ jobs.docker_publish.outputs.image_tags }}
      image_refs:
        description: "Published image refs as comma-separated list"
        value: ${{ jobs.docker_publish.outputs.image_refs }}
      digest:
        description: "Image digest from the pushed OCI image"
        value: ${{ jobs.docker_publish.outputs.digest }}
      image_with_digest:
        description: "Image reference pinned by digest"
        value: ${{ jobs.docker_publish.outputs.image_with_digest }}
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
      pull_registry_username:
        required: false
      pull_registry_password:
        required: false

permissions:
  contents: read
  actions: write

jobs:
  docker_publish:
    name: Build And Publish OCI Image
    runs-on: ${{ fromJSON(inputs.RUNS_ON_JSON) }}
    timeout-minutes: 30
    env:
      REGISTRY_USERNAME: ${{ secrets.registry_username }}
      REGISTRY_PASSWORD: ${{ secrets.registry_password }}
      PULL_REGISTRY_USERNAME: ${{ secrets.pull_registry_username }}
      PULL_REGISTRY_PASSWORD: ${{ secrets.pull_registry_password }}
    outputs:
      image_ref: ${{ steps.tags.outputs.image_ref }}
      image_tags: ${{ steps.tags.outputs.image_tags }}
      image_refs: ${{ steps.tags.outputs.image_refs }}
      digest: ${{ steps.final_ref.outputs.digest }}
      image_with_digest: ${{ steps.final_ref.outputs.image_with_digest }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve image tags
        id: tags
        env:
          OCI_REGISTRY: ${{ inputs.OCI_REGISTRY }}
          OCI_IMAGE_NAME: ${{ inputs.OCI_IMAGE_NAME }}
          OCI_TAGS: ${{ inputs.OCI_TAGS }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${OCI_REGISTRY}" || -z "${OCI_IMAGE_NAME}" ]]; then
            echo "OCI_REGISTRY and OCI_IMAGE_NAME are required." >&2
            exit 1
          fi

          image_ref="${OCI_REGISTRY%/}/${OCI_IMAGE_NAME#/}"
          short_sha="${GITHUB_SHA:0:12}"
          tag_re='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'

          refs=()
          bare_tags=()

          add_ref() {
            local item="$1"
            local ref tag existing

            if [[ "${item}" == "${image_ref}:"* ]]; then
              ref="${item}"
              tag="${item#${image_ref}:}"
            else
              if [[ "${item}" == *"/"* || "${item}" == *":"* ]]; then
                echo "full image refs must target ${image_ref}: ${item}" >&2
                exit 1
              fi
              tag="${item}"
              ref="${image_ref}:${tag}"
            fi

            if [[ ! "${tag}" =~ ${tag_re} ]]; then
              echo "invalid docker tag: ${tag}" >&2
              exit 1
            fi

            for existing in "${refs[@]}"; do
              if [[ "${existing}" == "${ref}" ]]; then
                return 0
              fi
            done

            refs+=("${ref}")
            bare_tags+=("${tag}")
          }

          if [[ -n "${OCI_TAGS//[[:space:],;]/}" ]]; then
            while IFS= read -r raw_tag; do
              tag="$(printf '%s' "${raw_tag}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [[ -z "${tag}" ]] && continue
              add_ref "${tag}"
            done < <(printf '%s\n' "${OCI_TAGS}" | tr ',;' '\n')
          else
            add_ref "sha-${short_sha}"
          fi

          image_tags_csv=""
          image_refs_csv=""
          for idx in "${!refs[@]}"; do
            if [[ -z "${image_tags_csv}" ]]; then
              image_tags_csv="${bare_tags[${idx}]}"
              image_refs_csv="${refs[${idx}]}"
            else
              image_tags_csv="${image_tags_csv},${bare_tags[${idx}]}"
              image_refs_csv="${image_refs_csv},${refs[${idx}]}"
            fi
          done

          {
            echo "tags<<EOF"
            printf '%s\n' "${refs[@]}"
            echo "EOF"
            echo "image_ref=${image_ref}"
            echo "primary_ref=${refs[0]}"
            echo "image_tags=${image_tags_csv}"
            echo "image_refs=${image_refs_csv}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate push mode
        env:
          OCI_PUSH_MODE: ${{ inputs.OCI_PUSH_MODE }}
          OCI_TARGET_PLATFORMS: ${{ inputs.OCI_TARGET_PLATFORMS }}
        run: |
          set -euo pipefail
          case "${OCI_PUSH_MODE}" in
            buildx)
              ;;
            docker)
              if [[ "${OCI_TARGET_PLATFORMS}" != "linux/amd64" ]]; then
                echo "OCI_PUSH_MODE=docker only supports OCI_TARGET_PLATFORMS=linux/amd64." >&2
                exit 1
              fi
              ;;
            *)
              echo "OCI_PUSH_MODE must be buildx or docker." >&2
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to extra pull registry
        if: ${{ inputs.OCI_EXTRA_PULL_REGISTRY != '' && env.PULL_REGISTRY_USERNAME != '' && env.PULL_REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.OCI_EXTRA_PULL_REGISTRY }}
          username: ${{ env.PULL_REGISTRY_USERNAME }}
          password: ${{ env.PULL_REGISTRY_PASSWORD }}

      - name: Login to OCI registry
        if: ${{ inputs.OCI_PUSH_IMAGE && env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.OCI_REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build image
        id: build
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.OCI_BUILD_CONTEXT }}
          file: ${{ inputs.OCI_DOCKERFILE_PATH }}
          platforms: ${{ inputs.OCI_TARGET_PLATFORMS }}
          push: ${{ inputs.OCI_PUSH_IMAGE && inputs.OCI_PUSH_MODE == 'buildx' }}
          load: ${{ inputs.OCI_PUSH_MODE == 'docker' }}
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ inputs.OCI_BUILD_ARGS }}
          cache-from: ${{ inputs.OCI_CACHE_SCOPE != '' && format('type=gha,scope={0}', inputs.OCI_CACHE_SCOPE) || '' }}
          cache-to: ${{ inputs.OCI_CACHE_SCOPE != '' && format('type=gha,scope={0},mode=max', inputs.OCI_CACHE_SCOPE) || '' }}

      - name: Push image with Docker
        id: docker_push
        if: ${{ inputs.OCI_PUSH_MODE == 'docker' && inputs.OCI_PUSH_IMAGE }}
        env:
          PRIMARY_REF: ${{ steps.tags.outputs.primary_ref }}
          IMAGE_REFS: ${{ steps.tags.outputs.image_refs }}
        run: |
          set -euo pipefail
          IFS=',' read -ra refs <<< "${IMAGE_REFS}"
          for ref in "${refs[@]}"; do
            [[ -z "${ref}" ]] && continue
            docker push "${ref}"
          done

          digest="$(docker buildx imagetools inspect "${PRIMARY_REF}" --format '{{.Digest}}')"
          if [[ -z "${digest}" || "${digest}" == "<no value>" ]]; then
            image_with_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${PRIMARY_REF}" 2>/dev/null || true)"
            digest="${image_with_digest##*@}"
          fi
          if [[ -z "${digest}" || "${digest}" == "<no value>" || "${digest}" != sha256:* ]]; then
            echo "failed to resolve pushed image digest for ${PRIMARY_REF}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Resolve digest reference
        id: final_ref
        env:
          IMAGE_REF: ${{ steps.tags.outputs.image_ref }}
          DIGEST: ${{ steps.build.outputs.digest || steps.docker_push.outputs.digest }}
        run: |
          set -euo pipefail
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${DIGEST}" ]]; then
            echo "image_with_digest=${IMAGE_REF}@${DIGEST}" >> "${GITHUB_OUTPUT}"
          else
            echo "image_with_digest=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish summary
        if: ${{ always() }}
        env:
          IMAGE_REF: ${{ steps.tags.outputs.image_ref }}
          IMAGE_TAGS: ${{ steps.tags.outputs.image_tags }}
          IMAGE_REFS: ${{ steps.tags.outputs.image_refs }}
          DIGEST: ${{ steps.final_ref.outputs.digest }}
          IMAGE_WITH_DIGEST: ${{ steps.final_ref.outputs.image_with_digest }}
          PUSH_IMAGE: ${{ inputs.OCI_PUSH_IMAGE }}
          PUSH_MODE: ${{ inputs.OCI_PUSH_MODE }}
        run: |
          set -euo pipefail

          digest_display="${DIGEST:-}"
          if [[ -n "${IMAGE_WITH_DIGEST}" ]]; then
            digest_display="${IMAGE_WITH_DIGEST}"
          fi

          {
            echo "### Docker Image Build"
            echo ""
            echo "- image: \`${IMAGE_REF}\`"
            echo "- tags: \`${IMAGE_TAGS}\`"
            echo "- refs: \`${IMAGE_REFS}\`"
            echo "- push: \`${PUSH_IMAGE}\`"
            echo "- push mode: \`${PUSH_MODE}\`"
            echo "- digest: \`${digest_display}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
