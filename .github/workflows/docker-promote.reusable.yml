name: Docker Promote Reusable Workflow

on:
  workflow_call:
    inputs:
      OCI_SOURCE_REF:
        description: "Fully qualified source image ref, either tag or digest pinned"
        required: true
        type: string
      OCI_TARGET_REFS:
        description: "Fully qualified target image refs to create; newline/comma/semicolon separated"
        required: true
        type: string
      OCI_LOGIN_REGISTRIES:
        description: "Optional registries to docker login before promotion; newline/comma/semicolon separated. Empty derives registries from OCI_SOURCE_REF and OCI_TARGET_REFS."
        required: false
        type: string
        default: ""
      OCI_PROMOTE_DRY_RUN:
        description: "Validate and print promotion plan without mutating tags"
        required: false
        type: boolean
        default: false
      RUNS_ON_JSON:
        description: "JSON value for runs-on (for example: \"ubuntu-latest\" or [\"self-hosted\",\"linux\"])"
        required: false
        type: string
        default: '"ubuntu-latest"'
    outputs:
      source_ref:
        description: "Source image reference used for promotion"
        value: ${{ jobs.docker_promote.outputs.source_ref }}
      digest:
        description: "Resolved source image digest"
        value: ${{ jobs.docker_promote.outputs.digest }}
      source_with_digest:
        description: "Source image pinned by digest"
        value: ${{ jobs.docker_promote.outputs.source_with_digest }}
      promoted_refs:
        description: "Promoted refs as comma-separated list"
        value: ${{ jobs.docker_promote.outputs.promoted_refs }}
      promoted_count:
        description: "Number of promoted refs"
        value: ${{ jobs.docker_promote.outputs.promoted_count }}
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

permissions:
  contents: read

jobs:
  docker_promote:
    name: Promote OCI Image Tags By Digest
    runs-on: ${{ fromJSON(inputs.RUNS_ON_JSON) }}
    timeout-minutes: 30
    env:
      REGISTRY_USERNAME: ${{ secrets.registry_username }}
      REGISTRY_PASSWORD: ${{ secrets.registry_password }}
    outputs:
      source_ref: ${{ steps.plan.outputs.source_ref }}
      digest: ${{ steps.digest.outputs.digest }}
      source_with_digest: ${{ steps.digest.outputs.source_with_digest }}
      promoted_refs: ${{ steps.plan.outputs.target_refs_csv }}
      promoted_count: ${{ steps.promote.outputs.promoted_count }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Plan promotion refs
        id: plan
        env:
          OCI_SOURCE_REF: ${{ inputs.OCI_SOURCE_REF }}
          OCI_TARGET_REFS: ${{ inputs.OCI_TARGET_REFS }}
          OCI_LOGIN_REGISTRIES: ${{ inputs.OCI_LOGIN_REGISTRIES }}
        run: |
          set -euo pipefail

          source_ref="$(printf '%s' "${OCI_SOURCE_REF}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ -z "${source_ref}" ]]; then
            echo "OCI_SOURCE_REF is required." >&2
            exit 1
          fi

          tag_ref_re='^.+:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          digest_ref_re='^.+@sha256:[0-9A-Fa-f]{64}$'
          if [[ ! "${source_ref}" =~ ${tag_ref_re} && ! "${source_ref}" =~ ${digest_ref_re} ]]; then
            echo "OCI_SOURCE_REF must be a full tag ref or digest ref: ${source_ref}" >&2
            exit 1
          fi

          target_refs=()
          registries=()

          add_unique() {
            local value="$1"
            local -n out_array="$2"
            local existing
            for existing in "${out_array[@]}"; do
              if [[ "${existing}" == "${value}" ]]; then
                return 0
              fi
            done
            out_array+=("${value}")
          }

          parse_registry() {
            local ref="$1"
            local registry="${ref%%/*}"
            if [[ -z "${registry}" || "${registry}" == "${ref}" ]]; then
              echo "invalid full image ref, missing registry/name: ${ref}" >&2
              exit 1
            fi
            printf '%s\n' "${registry}"
          }

          while IFS= read -r raw_ref; do
            ref="$(printf '%s' "${raw_ref}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ -z "${ref}" ]] && continue

            if [[ "${ref}" == *@* ]]; then
              echo "target refs must be tag refs, not digest refs: ${ref}" >&2
              exit 1
            fi
            if [[ ! "${ref}" =~ ${tag_ref_re} ]]; then
              echo "invalid target image ref: ${ref}" >&2
              exit 1
            fi

            add_unique "${ref}" target_refs
          done < <(printf '%s\n' "${OCI_TARGET_REFS}" | tr ',;' '\n')

          if ((${#target_refs[@]} == 0)); then
            echo "OCI_TARGET_REFS must contain at least one target ref." >&2
            exit 1
          fi

          if [[ -n "${OCI_LOGIN_REGISTRIES//[[:space:],;]/}" ]]; then
            while IFS= read -r raw_registry; do
              registry="$(printf '%s' "${raw_registry}" | sed 's|^https\?://||;s|/.*$||;s/^[[:space:]]*//;s/[[:space:]]*$//')"
              [[ -z "${registry}" ]] && continue
              add_unique "${registry}" registries
            done < <(printf '%s\n' "${OCI_LOGIN_REGISTRIES}" | tr ',;' '\n')
          else
            add_unique "$(parse_registry "${source_ref}")" registries
            for ref in "${target_refs[@]}"; do
              add_unique "$(parse_registry "${ref}")" registries
            done
          fi

          target_refs_csv=""
          for ref in "${target_refs[@]}"; do
            if [[ -z "${target_refs_csv}" ]]; then
              target_refs_csv="${ref}"
            else
              target_refs_csv="${target_refs_csv},${ref}"
            fi
          done

          {
            echo "target_refs<<EOF"
            printf '%s\n' "${target_refs[@]}"
            echo "EOF"
            echo "login_registries<<EOF"
            printf '%s\n' "${registries[@]}"
            echo "EOF"
            echo "source_ref=${source_ref}"
            echo "target_refs_csv=${target_refs_csv}"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to registries
        if: ${{ env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != '' }}
        env:
          LOGIN_REGISTRIES: ${{ steps.plan.outputs.login_registries }}
        run: |
          set -euo pipefail

          while IFS= read -r registry; do
            [[ -z "${registry}" ]] && continue
            printf '%s' "${REGISTRY_PASSWORD}" | docker login "${registry}" --username "${REGISTRY_USERNAME}" --password-stdin
          done <<< "${LOGIN_REGISTRIES}"

      - name: Resolve source digest
        id: digest
        env:
          SOURCE_REF: ${{ steps.plan.outputs.source_ref }}
        run: |
          set -euo pipefail

          digest_ref_re='^.+@sha256:[0-9A-Fa-f]{64}$'
          if [[ "${SOURCE_REF}" =~ ${digest_ref_re} ]]; then
            digest="${SOURCE_REF##*@}"
            source_with_digest="${SOURCE_REF}"
          else
            inspect_output="$(docker buildx imagetools inspect "${SOURCE_REF}" 2>&1 || true)"
            digest="$(printf '%s\n' "${inspect_output}" | sed -nE 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9A-Fa-f]{64}).*$/\1/p' | head -n1 || true)"
            if [[ -z "${digest}" ]]; then
              echo "failed to resolve digest from source ref: ${SOURCE_REF}" >&2
              printf '%s\n' "${inspect_output}" >&2
              exit 1
            fi
            source_base="${SOURCE_REF%%@*}"
            source_base="${source_base%:*}"
            source_with_digest="${source_base}@${digest}"
          fi

          {
            echo "digest=${digest}"
            echo "source_with_digest=${source_with_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Promote refs from digest
        id: promote
        env:
          SOURCE_WITH_DIGEST: ${{ steps.digest.outputs.source_with_digest }}
          TARGET_REFS: ${{ steps.plan.outputs.target_refs }}
          PROMOTE_DRY_RUN: ${{ inputs.OCI_PROMOTE_DRY_RUN }}
        run: |
          set -euo pipefail

          promoted_count=0
          while IFS= read -r target_ref; do
            [[ -z "${target_ref}" ]] && continue
            if [[ "${PROMOTE_DRY_RUN}" == "true" ]]; then
              echo "[DRY_RUN] docker buildx imagetools create --tag ${target_ref} ${SOURCE_WITH_DIGEST}"
            else
              docker buildx imagetools create --tag "${target_ref}" "${SOURCE_WITH_DIGEST}"
            fi
            promoted_count=$((promoted_count + 1))
          done <<< "${TARGET_REFS}"

          echo "promoted_count=${promoted_count}" >> "${GITHUB_OUTPUT}"

      - name: Promotion summary
        if: ${{ always() }}
        env:
          SOURCE_REF: ${{ steps.plan.outputs.source_ref }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          SOURCE_WITH_DIGEST: ${{ steps.digest.outputs.source_with_digest }}
          TARGET_REFS: ${{ steps.plan.outputs.target_refs }}
          PROMOTE_DRY_RUN: ${{ inputs.OCI_PROMOTE_DRY_RUN }}
          PROMOTED_COUNT: ${{ steps.promote.outputs.promoted_count }}
        run: |
          {
            echo "### Docker Promote Summary"
            echo ""
            echo "- source: \`${SOURCE_REF}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- source_with_digest: \`${SOURCE_WITH_DIGEST}\`"
            echo "- dry_run: \`${PROMOTE_DRY_RUN}\`"
            echo "- promoted refs (${PROMOTED_COUNT}):"
            while IFS= read -r ref; do
              if [[ -n "${ref}" ]]; then
                echo "  - \`${ref}\`"
              fi
            done <<< "${TARGET_REFS}"
          } >> "${GITHUB_STEP_SUMMARY}"
